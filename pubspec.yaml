name: boxbox
description: "Profitable cubes."
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: ^3.7.0
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  window_manager: ^0.5.2
  cannon_physics: ^0.0.3
  vector_math: ^2.2.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  assets:
    - lib/assets/background/sample.png
    - lib/assets/background/highlight.png
    - lib/assets/background/giphy.gif
    - lib/assets/background/kitchen.png
    - lib/assets/background/forest.png
    - lib/assets/background/loading.png
    - lib/assets/coin/icon1.png
    - lib/assets/coin/pile.png
    - lib/assets/heart/icon1.png
    - lib/assets/heart/broken1.png
    - lib/assets/play/icon.png
    - lib/assets/count/balls1.png
    - lib/assets/count/balls2.png
    - lib/assets/ad/icon.png
    - lib/assets/floor/grass.png
    - lib/assets/floor/wood/8.png