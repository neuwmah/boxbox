name: boxbox
description: "Profitable cubes."
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: ^3.7.0
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  window_manager: ^0.5.2
  cannon_physics: ^0.0.3
  vector_math: ^2.2.0
  url_launcher: ^6.3.2
  flutter_soloud: ^3.4.8
  google_mobile_ads: ^9.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
flutter:
  uses-material-design: true
  fonts:
    - family: Fredoka
      fonts:
        - asset: lib/assets/fonts/Fredoka.ttf
  shaders:
    - lib/shaders/cubes.frag
  assets:
    - lib/assets/game/1.png
    - lib/assets/game/2.png
    - lib/assets/game/3.png
    - lib/assets/game/4.png
    - lib/assets/game/5.png
    - lib/assets/loading.png
    - lib/assets/logo.png
    - lib/assets/coin/icon1.png
    - lib/assets/coin/pile.png
    - lib/assets/heart/icon1.png
    - lib/assets/heart/broken1.png
    - lib/assets/play/home.png
    - lib/assets/play/settings.png
    - lib/assets/play/shop.png
    - lib/assets/count/balls1.png
    - lib/assets/count/balls2.png
    - lib/assets/count/balls3.png
    - lib/assets/count/balls4.png
    - lib/assets/count/balls5.png
    - lib/assets/ad.png
    - lib/assets/cancel.png
    - lib/assets/success.png
    - lib/assets/close.png
    - lib/assets/floor/grass.png
    - lib/assets/floor/farm.png
    - lib/assets/floor/wood/8.png
    - lib/assets/floor/super.png
    - lib/assets/sound/background1.mp3
    - lib/assets/sound/background2.mp3
    - lib/assets/sound/touch.mp3
    - lib/assets/sound/touch1.mp3
    - lib/assets/sound/touch2.MP3
    - lib/assets/sound/hit.mp3
    - lib/assets/sound/fall.mp3
    - lib/assets/sound/fail.mp3
    - lib/assets/sound/shot.mp3
    - lib/assets/sound/gg.mp3
    - lib/assets/sound/coin_finish.mp3
    - lib/assets/sound/coin_repeat.mp3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "lib/assets/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "lib/assets/icon.png"
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "lib/assets/icon.png"
    background_color: "#000000"
    theme_color: "#000000"
  windows:
    generate: true
    image_path: "lib/assets/icon.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "lib/assets/icon.png"